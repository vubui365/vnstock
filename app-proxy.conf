    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Python is source-of-truth cho Content-Type + Cache-Control
}

# ── 🔔 Auto-update checker JS (exact match) ─────────────────────────
# Phải đặt exact `=` để vượt qua nginx static-file handler cho .js
# (main vhost có rule `\.(js|css|png)$` chặn trước → /api/*.js bị 404)
# LƯU Ý: /sw.js và /api/version ĐÃ có trong main vhost — KHÔNG thêm
# (sẽ gây "duplicate location" emerg + aapanel-deploy auto-rollback)
location = /api/update-checker.js {
    proxy_pass http://127.0.0.1:3333/api/update-checker.js;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Python set Cache-Control public max-age=3600
}

# ── 🚀 IndexNow key file — /<32-hex>.txt phải reach Python ──────
# Nginx static handler default chặn .txt → 404 từ disk
# QUOTE regex để nginx parse {32} đúng (otherwise treated as config block)
# Required by Bing để verify ownership trước khi accept IndexNow submissions
location ~ "^/[a-f0-9]{32}\.txt$" {
    proxy_pass http://127.0.0.1:3333$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    add_header Cache-Control "public, max-age=86400" always;
}

# ── 🔌 Embeddable widget JS (exact match) ─────────────────────────
# External sites: <script src="/api/embed/widget.js" data-tool="..."></script>
# Cùng vấn đề .js extension → cần exact match
location = /api/embed/widget.js {
    proxy_pass http://127.0.0.1:3333/api/embed/widget.js;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Allow CORS (Python set Access-Control-Allow-Origin: *)
    add_header Access-Control-Allow-Origin "*" always;
    # Cache 1 day cho external embed (cache busted by URL hash)
}

# ── 🔌 Developer API JSON endpoints — /api/scan/*.json + /api/market-snapshot.json ──
# JSON files có thể bị static handler chặn — cần regex location explicit
# Cùng pattern issue như /api/*.js
location ~ ^/api/scan/[a-z0-9_-]+\.json$ {
    proxy_pass http://127.0.0.1:3333$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
