}

# ── 📈 Stock pages (/stock/<SYM>) — SSR, 1000+ pages cho Google ──
# Mỗi mã có 1 trang SEO riêng với data realtime + AI summary + FAQ + Schema
location ~ ^/stock(/|$) {
