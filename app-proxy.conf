    proxy_pass http://127.0.0.1:3333;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Secure-Token $http_secure_token;
    proxy_read_timeout 30s;
}

# ── 📧 Newsletter subscription endpoints (public) ──────────────────
# Try ALL match levels — exact + prefix + regex để vượt main vhost conflict
location = /api/newsletter/subscribe {
    proxy_pass http://127.0.0.1:3333;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    add_header Access-Control-Allow-Origin "*" always;
}
location = /api/newsletter/unsubscribe {
    proxy_pass http://127.0.0.1:3333;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
# Prefix match — ^~ priority hơn regex
location ^~ /api/newsletter/ {
    proxy_pass http://127.0.0.1:3333;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    add_header Access-Control-Allow-Origin "*" always;
}
# /unsubscribe page (user-friendly URL từ email)
location = /unsubscribe {
    proxy_pass http://127.0.0.1:3333;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# ── 📊 Legacy programmatic SEO root-level pages ──
# /top-ai-buy-signals, /top-ai-sell-signals, /stocks-with-rsi-under-30,
# /stocks-with-rsi-above-70, /macd-bullish-cross, /stocks-breakout-volume,
# /golden-cross-ema50-200, /death-cross-ema50-200, /top-high-score-stocks,
# /penny-stocks-under-10k, /co-phieu-co-tuc-cao, /large-cap-vn30,
# /stocks-near-52-week-high, /stocks-near-52-week-low
location ~ ^/(top-ai-buy-signals|top-ai-sell-signals|stocks-with-rsi-under-30|stocks-with-rsi-above-70|macd-bullish-cross|stocks-breakout-volume|golden-cross-ema50-200|death-cross-ema50-200|top-high-score-stocks|penny-stocks-under-10k|co-phieu-co-tuc-cao|large-cap-vn30|stocks-near-52-week-high|stocks-near-52-week-low)$ {
    proxy_pass http://127.0.0.1:3333$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    add_header Cache-Control "public, max-age=1800, stale-while-revalidate=600" always;
}

