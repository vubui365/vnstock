# ══════════════════════════════════════════════════════════
# vnstock.io.vn — App + Landing proxy rules
# Đường dẫn VPS: /www/server/panel/vhost/nginx/extension/vnstock.io.vn/app-proxy.conf
# File này được aaPanel tự include, KHÔNG bị ghi đè khi reload panel
# ══════════════════════════════════════════════════════════

# ── Landing page (trang chủ) ──
location = / {
    proxy_pass http://127.0.0.1:3333/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
}

# ── App chính /app ──
location = /app {
    proxy_pass http://127.0.0.1:3333/app;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
}

# ── WebSocket realtime (TCBS/SSI price feed) ──
location /ws {
    proxy_pass http://127.0.0.1:10000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

# ── SEO files qua Python ──
location = /sitemap.xml {
    proxy_pass http://127.0.0.1:3333/sitemap.xml;
    proxy_set_header Host $host;
    add_header Cache-Control "public, max-age=3600" always;
}

# ── Dynamic sitemaps (Google index 591+ pages) ──
# /sitemap-index.xml chứa references đến 3 sub-sitemaps:
#   - /sitemap-stocks.xml   : 300 stocks
#   - /sitemap-blog.xml     : 230 blog posts
#   - /sitemap-pages.xml    : 61 indicator/compare/sector pages
location ~ ^/sitemap-(index|stocks|blog|pages|news)\.xml$ {
    proxy_pass http://127.0.0.1:3333$request_uri;
    proxy_set_header Host $host;
    add_header Cache-Control "public, max-age=3600" always;
}

location = /robots.txt {
    proxy_pass http://127.0.0.1:3333/robots.txt;
    proxy_set_header Host $host;
    add_header Cache-Control "public, max-age=3600" always;
}

# ── 📰 SEO Blog posts MỚI (/blog/<slug>, /blog/, /blog/category/<cat>) ──
# URL canonical mới (thay thế /bai-viet/). Python render server-side
# với 3 schema (Article + FAQ + Breadcrumb) + GA4 + Featured Image SEO
location ~ ^/blog(/|$) {
    proxy_pass http://127.0.0.1:3333$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    add_header Cache-Control "public, max-age=3600" always;
}

# ── 📰 LEGACY /bai-viet/<slug> — chỉ để Python xử 301 redirect → /blog/ ─
# Giữ link juice từ traffic cũ (Google/GSC đã index)
location ~ ^/bai-viet/ {
    proxy_pass http://127.0.0.1:3333$request_uri;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # KHÔNG cache 301 redirect mạnh
    add_header Cache-Control "public, max-age=300" always;
}

