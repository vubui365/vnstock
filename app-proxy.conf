# ── PWA icons (192/512) ──
location ~ ^/pwa-icon-(192|512)\.png$ {
    proxy_pass http://127.0.0.1:3333$request_uri;
    proxy_set_header Host $host;
    add_header Cache-Control "public, max-age=604800";
}

# ── TWA Digital Asset Links (bắt buộc cho Android app trên CH Play) ──
# QUAN TRỌNG: KHÔNG cache file này — Google verifier cần fingerprint mới nhất.
# Nếu cache stale, TWA verify fail và app sẽ fallback Custom Tab (có URL bar).
location = /.well-known/assetlinks.json {
    proxy_pass http://127.0.0.1:3333/.well-known/assetlinks.json;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Tắt mọi cache nginx có thể có
    proxy_no_cache 1;
    proxy_cache_bypass 1;
    # Header force no-cache (override mọi default từ aaPanel/Python)
    add_header Content-Type "application/json" always;
    add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    add_header Pragma "no-cache" always;
    add_header Expires "0" always;
}

# ── Landing assets (og:image, favicon) ──
location = /icons/preview.png {
    proxy_pass http://127.0.0.1:3333/icons/preview.png;
    add_header Cache-Control "public, max-age=604800";
}

location = /icons/favicon.png {
    proxy_pass http://127.0.0.1:3333/icons/favicon.png;
    add_header Cache-Control "public, max-age=604800";
}
